name: PDM
description: Install PDM from our version
runs:
  using: composite
  steps:
    - name: Install Python for PDM
      # This action reads the Python version from .python-version
      # PDM 2.12.2 doesn't install properly on Python 3.14
      uses: actions/setup-python@v6
    - name: Set up PDM
      uses: pdm-project/setup-pdm@c050bdcb2405837648035b6678c75609d53a749f
      with:
        python-version: "3.9"
        version: 2.12.2
        # Cache all dependencies installed from pdm.lock
        cache: true
